name: Windows camera installer
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a release (select an existing version tag)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: camera-build-and-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 40
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        submodules: recursive
    - uses: actions/setup-dotnet@v6.1.0
      with:
        dotnet-version: '10.0.x'
    - name: Validate release version
      if: startsWith(github.ref, 'refs/tags/') || inputs.publish
      shell: pwsh
      run: |
        $version = ([xml](Get-Content src/PortraitCamera/PortraitCamera.csproj -Raw)).Project.PropertyGroup.Version
        if ($env:GITHUB_REF -ne "refs/tags/v$version" -or $version -notmatch '^\d+\.\d+\.\d+$') {
          throw 'Releases require a vMAJOR.MINOR.PATCH tag matching the app version.'
        }
        if (!(Test-Path "docs/releases/v$version.md")) { throw 'Release notes are missing.' }
    - name: Build both native architectures and installer
      run: ./scripts/build.ps1
    - name: Run offline camera self-tests
      run: |
        $ErrorActionPreference = 'Stop'
        $report = Join-Path $PWD 'dist/self-test'
        $process = Start-Process -FilePath "$PWD/dist/app/PortraitCamera.exe" -ArgumentList @('--self-test', '--output', $report) -Wait -PassThru -WindowStyle Hidden
        if ($process.ExitCode -ne 0) { throw "Self-tests failed: $($process.ExitCode)" }
        $result = Get-Content "$report/results.json" -Raw | ConvertFrom-Json
        if (!$result.passed) { throw 'Self-test report did not pass.' }
        $env:GITHUB_SHA | Set-Content dist/BUILD-COMMIT.txt
    - uses: actions/github-script@v9
      with:
        script: |
          const publish = require('./.github/scripts/publish-build.cjs');
          await publish({github, context, core, glob, exec});
      env:
        BUILD_NAME: PortraitCamera-Windows-installer
        BUILD_PATHS: |
          dist/*-Setup-*.exe
          dist/SHA256SUMS.txt
          dist/BUILD-COMMIT.txt
          dist/self-test/
        BUILD_HIDDEN: 'false'
        BUILD_MISSING: error
      if: (success()) && success() && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event_name != 'pull_request'
    - uses: actions/upload-artifact@v7.0.2
      with:
        name: PortraitCamera-Windows-installer
        path: |
          dist/*-Setup-*.exe
          dist/SHA256SUMS.txt
          dist/BUILD-COMMIT.txt
          dist/self-test/
        if-no-files-found: error
        retention-days: 1
      if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    permissions:
      contents: write
  release:
    name: Publish verified release
    needs: windows
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')) || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write
    steps:
    - uses: actions/checkout@v7.0.1
      with:
        persist-credentials: false
    - uses: actions/download-artifact@v8.0.2
      with:
        name: PortraitCamera-Windows-installer
        path: dist
    - name: Publish installer, checksums, and build receipt
      shell: pwsh
      env:
        GH_TOKEN: ${{ github.token }}
      run: ./scripts/publish-release.ps1 -Tag $env:GITHUB_REF_NAME
    - name: Remove completed release transfer
      if: always()
      uses: actions/github-script@v9
      with:
        script: |
          const artifacts = await github.paginate(github.rest.actions.listWorkflowRunArtifacts, {...context.repo, run_id: context.runId, per_page: 100});
          for (const artifact of artifacts) await github.rest.actions.deleteArtifact({...context.repo, artifact_id: artifact.id});
